name: Code Library Feature checks
on:
  push:
    branches: [feature/permanent-code-library]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check worker/index.js
          node --check v2/api.js
          node --check v2/crypto.js
          node --check v2/app.js
          node --check v2/library.js
      - name: Test encrypted clipboard and library
        run: |
          npm test
          node --test v2/app.test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser integration test
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 > /tmp/jira-helper-http.log 2>&1 &
          node v2/browser-smoke.mjs
