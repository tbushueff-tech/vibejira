name: Russian proxy regression
on:
  push:
    branches: [feature/manual-russian-proxy-login]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS tests including login route selection and Worker
        run: node --test v2/app.test.mjs v2/proxy-mode.test.mjs worker/test/*.test.mjs
      - name: PHP syntax and CORS/preflight smoke
        run: |
          php -l hostiman/api.php
          php -S 127.0.0.1:8077 -t hostiman >/tmp/helper-relay-php.log 2>&1 &
          sleep 1
          curl -fsS -D /tmp/helper-headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://tbushueff-tech.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            'http://127.0.0.1:8077/api.php?route=%2Fauth%2Flogin'
          grep -qi 'HTTP/1.1 204' /tmp/helper-headers
          grep -qi 'Access-Control-Allow-Origin: https://tbushueff-tech.github.io' /tmp/helper-headers
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8077/api.php?route=%2Fevil')" = "404"
