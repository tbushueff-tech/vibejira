name: Verify deployed HostiMan without credentials
on:
  push:
    branches: [check/hostiman-relay-20261113]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check DNS TLS CORS preflight and unauthenticated auth endpoint
        shell: bash
        run: |
          set -uo pipefail
          url='https://tbhelper.h1n.ru/api.php?route=%2Fauth%2Fme'
          curl -sS --max-time 25 -D /tmp/helper-get-headers -o /tmp/helper-body -w 'GET HTTP %{http_code}; TLS verified; remote IP %{remote_ip}\n' -H 'Origin: https://tbushueff-tech.github.io' "$url"
          echo 'GET CORS:'
          grep -iE '^(HTTP/|access-control-allow-origin:|content-type:)' /tmp/helper-get-headers || true
          echo 'GET body (first 180 chars):'
          head -c 180 /tmp/helper-body; echo
          curl -sS --max-time 25 -X OPTIONS -D /tmp/helper-options-headers -o /dev/null -w 'OPTIONS HTTP %{http_code}\n' -H 'Origin: https://tbushueff-tech.github.io' -H 'Access-Control-Request-Method: POST' 'https://tbhelper.h1n.ru/api.php?route=%2Fauth%2Flogin'
          grep -iE '^(HTTP/|access-control-allow-origin:|access-control-allow-methods:|access-control-allow-headers:)' /tmp/helper-options-headers || true
