name: Verify polished proxy login
on:
  push:
    branches: [feature/polish-proxy-login-toggle]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS and Worker regression
        run: node --test v2/app.test.mjs v2/proxy-mode.test.mjs worker/test/*.test.mjs
      - name: Browser control regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/helper-http.log 2>&1 &
          node v2/proxy-browser-smoke.mjs
