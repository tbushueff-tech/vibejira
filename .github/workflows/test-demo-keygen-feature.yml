name: Demo Jira key format feature checks
on:
  push:
    branches: [feature/demo-atlassian-format-keygen]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check v2/demo-keygen.js
          node --check v2/demo-key-ui.js
          node --check v2/app.js
      - name: Test existing features and demo format
        run: |
          npm test
          node --test v2/app.test.mjs v2/demo-keygen.test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/jira-helper-http.log 2>&1 &
          node v2/browser-smoke.mjs
