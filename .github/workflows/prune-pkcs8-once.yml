name: Prune merged PKCS8 feature branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/prune-pkcs8-once.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Protect stable V2 and remove only merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/stable-v2-etalon-2026-11-10" --jq '.commit.sha')" = "cf28f768470e85a8d7a5b5c2bccb4a4d134c8e2d"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/feature/single-demo-pkcs8-key"
